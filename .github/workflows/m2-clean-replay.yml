name: M2 clean database replay

# Manual only: publishing this workflow must not automatically execute the replay.
'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-clean-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    # Standard runners in this existing public repository are free. No deployment environment/secrets.
    if: github.repository == 'MS3B09/Games-Recommendation-System' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Verified 0.8.2-pg17-bookworm multiarch digest; same pgvector version as M2 Supabase.
        image: pgvector/pgvector@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: m2_replay
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d m2_replay"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      PYTHONOPTIMIZE: '0'
      DATABASE_URL: ''
      MIGRATION_DATABASE_URL: ''
      GROQ_API_KEY: ''
      GAME_DISCOVERY_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure runner-local disposable paths
        shell: bash
        run: |
          printf '%s\n' \
            "M2_REPLAY_ROOT=$RUNNER_TEMP/m2-clean-replay" \
            "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/m2-clean-replay/venv" \
            "UV_CACHE_DIR=$RUNNER_TEMP/m2-clean-replay/uv-cache" \
            "HF_HOME=$RUNNER_TEMP/m2-clean-replay/hf-home" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.16'
          python-version: '3.13'
          enable-cache: false
      - name: Install locked CPU replay dependencies
        run: uv sync --project backend --locked --extra benchmark --extra dev --extra api-spike
      - name: Rebuild and verify twice against the disposable database
        env:
          M2_REPLAY_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: uv run --project backend --no-sync python -m game_discovery.jobs.replay_catalog
      - name: Retain only the small non-secret verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-clean-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-clean-replay/reports/replay.json
          if-no-files-found: warn
          retention-days: 7
      - name: Discard temporary sources, models, environments and local reports
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP:?}/m2-clean-replay"
      # Actions tears down the service container/network; the hosted VM (including volumes) is disposable.
