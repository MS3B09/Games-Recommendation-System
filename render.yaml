services:
  - type: web
    name: game-discovery-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv==0.11.16 && uv sync --locked --no-dev
    startCommand: .venv/bin/uvicorn game_discovery.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/live
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
