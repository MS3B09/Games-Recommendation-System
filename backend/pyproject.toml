[project]
name = "game-discovery"
version = "0.1.0"
description = "Guest game discovery API and reproducible catalog jobs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.143.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
]

[project.optional-dependencies]
collection = ["scrapling[fetchers]==0.4.15"]
benchmark = [
    "huggingface-hub==2.2.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "psutil==7.2.2",
    "tokenizers==0.23.3",
]
configuration = [
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
]
offline = [
    "sentence-transformers==5.7.0",
]
api-spike = [
    "httpx==0.28.1",
]
dev = ["ruff==0.17.0", "mypy==2.4.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.fastapi]
entrypoint = "game_discovery.api.main:app"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["src/game_discovery/api", "src/game_discovery/core", "src/game_discovery/db", "src/game_discovery/catalog/contracts.py", "src/game_discovery/catalog/repository.py", "src/game_discovery/catalog/discovery.py"]
